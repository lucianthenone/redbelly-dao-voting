<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" role="img" aria-labelledby="01-title 01-desc" class="diagram"><title id="01-title">From verification to a recorded vote</title><desc id="01-desc">Flow chart. Once, at Redbelly Access: 1 connect a wallet, 2 verify your identity with Averer, 3 enable the account. This must happen before a proposal is published. Then for each proposal on the governance platform: 4 the proposal is published, which records the snapshot block and opens voting, 5 connect your wallet, 6 the platform checks whether the wallet was enabled at the snapshot block. If yes: 7 choose and sign, which costs no gas, then 8 the vote is recorded with an IPFS receipt and can be changed until voting closes. If no: the wallet cannot vote on this proposal and has 0 voting power, but it can vote on proposals published later.</desc><defs><marker id="01-arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-muted"/></marker><marker id="01-arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-brand"/></marker><marker id="01-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-ok"/></marker><marker id="01-arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-no"/></marker><marker id="01-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-muted"/></marker></defs>
<rect class="dg-bg" width="720" height="712"/>
<text x="28" y="38" class="dg-accent dg-sans" font-size="13" font-weight="700" letter-spacing="1.3">FROM VERIFICATION TO A RECORDED VOTE</text>
<text x="28" y="62" class="dg-dim dg-sans" font-size="15" font-weight="400">Steps 1 to 3 happen once. Steps 4 to 8 happen for every proposal.</text>
<rect class="dg-zone" x="12" y="86" width="696" height="182" rx="8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="28" y="110" class="dg-muted dg-sans" font-size="12" font-weight="700" letter-spacing="1.2">ONCE, AT REDBELLY ACCESS</text>
<text x="692" y="110" class="dg-muted dg-mono" font-size="12" font-weight="400" text-anchor="end">access.redbelly.network</text>
<rect class="dg-card" x="28" y="124" width="200" height="128" rx="4" stroke-width="1"/>
<text x="44" y="150" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">01</text>
<text x="44" y="174" class="dg-ink dg-sans" font-size="16" font-weight="600">Connect wallet</text>
<text x="44" y="198" class="dg-dim dg-sans" font-size="14" font-weight="400">MetaMask or</text>
<text x="44" y="218" class="dg-dim dg-sans" font-size="14" font-weight="400">Coinbase Wallet</text>
<rect class="dg-card" x="260" y="124" width="200" height="128" rx="4" stroke-width="1"/>
<text x="276" y="150" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">02</text>
<text x="276" y="174" class="dg-ink dg-sans" font-size="16" font-weight="600">Verify identity</text>
<text x="276" y="198" class="dg-dim dg-sans" font-size="14" font-weight="400">Passport and biometric</text>
<text x="276" y="218" class="dg-dim dg-sans" font-size="14" font-weight="400">check with Averer</text>
<rect class="dg-card" x="492" y="124" width="200" height="128" rx="4" stroke-width="1"/>
<text x="508" y="150" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">03</text>
<text x="508" y="174" class="dg-ink dg-sans" font-size="16" font-weight="600">Enable account</text>
<text x="508" y="198" class="dg-dim dg-sans" font-size="14" font-weight="400">Sign in your wallet.</text>
<text x="508" y="218" class="dg-dim dg-sans" font-size="14" font-weight="400">Status shows Enabled</text>
<polyline class="dg-s-line" points="228,188 258,188" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-line)"/>
<polyline class="dg-s-line" points="460,188 490,188" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-line)"/>
<polyline class="dg-s-brand" points="592,252 592,292 128,292 128,344" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-brand)"/>
<rect class="dg-bg" x="217.32" y="283" width="285.36" height="20" rx="4"/>
<text x="360" y="297" class="dg-dim dg-sans" font-size="13" font-weight="500" text-anchor="middle">Enable before a proposal is published</text>
<rect class="dg-zone" x="12" y="310" width="696" height="356" rx="8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="148" y="334" class="dg-muted dg-sans" font-size="12" font-weight="700" letter-spacing="1.2">FOR EACH PROPOSAL, ON THE PLATFORM</text>
<text x="692" y="334" class="dg-muted dg-mono" font-size="12" font-weight="400" text-anchor="end">redbelly-governance.vercel.app</text>
<rect class="dg-card" x="28" y="346" width="200" height="128" rx="4" stroke-width="1"/>
<text x="44" y="372" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">04</text>
<text x="44" y="396" class="dg-ink dg-sans" font-size="16" font-weight="600">Proposal published</text>
<text x="44" y="420" class="dg-dim dg-sans" font-size="14" font-weight="400">Snapshot block is</text>
<text x="44" y="440" class="dg-dim dg-sans" font-size="14" font-weight="400">recorded. Voting</text>
<text x="44" y="460" class="dg-dim dg-sans" font-size="14" font-weight="400">opens at once</text>
<rect class="dg-card" x="260" y="346" width="200" height="128" rx="4" stroke-width="1"/>
<text x="276" y="372" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">05</text>
<text x="276" y="396" class="dg-ink dg-sans" font-size="16" font-weight="600">Connect wallet</text>
<text x="276" y="420" class="dg-dim dg-sans" font-size="14" font-weight="400">Browser wallet or</text>
<text x="276" y="440" class="dg-dim dg-sans" font-size="14" font-weight="400">WalletConnect on</text>
<text x="276" y="460" class="dg-dim dg-sans" font-size="14" font-weight="400">Redbelly Network</text>
<rect class="dg-card dg-s-brand" x="492" y="346" width="200" height="128" rx="4" stroke-width="1.75"/>
<text x="508" y="372" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">06</text>
<text x="508" y="396" class="dg-ink dg-sans" font-size="16" font-weight="600">Eligibility check</text>
<text x="508" y="420" class="dg-dim dg-sans" font-size="14" font-weight="400">Was this wallet</text>
<text x="508" y="440" class="dg-dim dg-sans" font-size="14" font-weight="400">enabled at the</text>
<text x="508" y="460" class="dg-dim dg-sans" font-size="14" font-weight="400">snapshot block?</text>
<polyline class="dg-s-line" points="228,410 258,410" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-line)"/>
<polyline class="dg-s-line" points="460,410 490,410" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-line)"/>
<polyline class="dg-s-ok" points="592,474 592,498 128,498 128,520" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-ok)"/>
<text x="140" y="488" class="dg-f-ok dg-sans" font-size="13" font-weight="700">Yes</text>
<polyline class="dg-s-no" points="592,498 592,520" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-no)"/>
<text x="604" y="514" class="dg-f-no dg-sans" font-size="13" font-weight="700">No</text>
<rect class="dg-card" x="28" y="522" width="200" height="128" rx="4" stroke-width="1"/>
<text x="44" y="548" class="dg-accent dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">07</text>
<text x="44" y="572" class="dg-ink dg-sans" font-size="16" font-weight="600">Choose and sign</text>
<text x="44" y="596" class="dg-dim dg-sans" font-size="14" font-weight="400">A signature, not a</text>
<text x="44" y="616" class="dg-dim dg-sans" font-size="14" font-weight="400">transaction. No gas</text>
<rect class="dg-card dg-s-ok" x="260" y="522" width="200" height="128" rx="4" stroke-width="1.75"/>
<text x="276" y="548" class="dg-f-ok dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">08</text>
<text x="276" y="572" class="dg-ink dg-sans" font-size="16" font-weight="600">Vote recorded</text>
<text x="276" y="596" class="dg-dim dg-sans" font-size="14" font-weight="400">IPFS receipt follows.</text>
<text x="276" y="616" class="dg-dim dg-sans" font-size="14" font-weight="400">Vote again to change</text>
<text x="276" y="636" class="dg-dim dg-sans" font-size="14" font-weight="400">it before close</text>
<rect class="dg-card dg-s-no" x="492" y="522" width="200" height="128" rx="4" stroke-width="1.75"/>
<text x="508" y="548" class="dg-f-no dg-mono" font-size="12" font-weight="600" letter-spacing="0.6">NO</text>
<text x="508" y="572" class="dg-ink dg-sans" font-size="16" font-weight="600">Not this proposal</text>
<text x="508" y="596" class="dg-dim dg-sans" font-size="14" font-weight="400">Voting power is 0.</text>
<text x="508" y="616" class="dg-dim dg-sans" font-size="14" font-weight="400">The wallet can vote</text>
<text x="508" y="636" class="dg-dim dg-sans" font-size="14" font-weight="400">on later proposals</text>
<polyline class="dg-s-line" points="228,586 258,586" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#01-arrow-line)"/>
<line class="dg-s-edge" x1="28" y1="674" x2="692" y2="674" stroke-width="1"/>
<text x="28" y="694" class="dg-muted dg-mono" font-size="11" font-weight="500" letter-spacing="0.6">LAST VERIFIED 22 OCT 2026</text>
<text x="692" y="694" class="dg-muted dg-mono" font-size="11" font-weight="400" text-anchor="end">redbelly-governance.vercel.app</text>
</svg>
