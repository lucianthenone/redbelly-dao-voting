<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="02-title 02-desc" class="diagram"><title id="02-title">When eligibility is checked</title><desc id="02-desc">Timeline. The snapshot is taken at the moment a proposal is published, and voting opens at the same moment. Wallet A was enabled before the snapshot, so it can vote. Wallet B was enabled after the snapshot, while voting was open, so it cannot vote on this proposal. Wallet B can vote on proposals published after it was enabled.</desc><style>.dg-bg{fill:#0c1317}.dg-card{fill:#141f26;stroke:#34444f}.dg-steel{fill:#1d3140;stroke:#34444f}.dg-zone{fill:none;stroke:#34444f}.dg-band{fill:#1d3140}.dg-ink{fill:#f1f5f8}.dg-dim{fill:#c2ced6}.dg-muted{fill:#8fa1ad}.dg-accent{fill:#ffb3ae}.dg-f-brand{fill:#EF5350}.dg-f-ok{fill:#86EFAC}.dg-f-no{fill:#ffb4ab}.dg-f-muted{fill:#8fa1ad}.dg-s-line{stroke:#8fa1ad}.dg-s-brand{stroke:#EF5350}.dg-s-ok{stroke:#86EFAC}.dg-s-no{stroke:#ffb4ab}.dg-s-muted{stroke:#8fa1ad}.dg-s-edge{stroke:#34444f}.dg-sans{font-family:'Be Vietnam Pro', ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.dg-mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style><defs><marker id="02-arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-muted"/></marker><marker id="02-arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-brand"/></marker><marker id="02-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-ok"/></marker><marker id="02-arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-no"/></marker><marker id="02-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dg-f-muted"/></marker></defs>
<rect class="dg-bg" width="720" height="484"/>
<text x="28" y="38" class="dg-accent dg-sans" font-size="13" font-weight="700" letter-spacing="1.3">WHEN ELIGIBILITY IS CHECKED</text>
<text x="28" y="62" class="dg-dim dg-sans" font-size="15" font-weight="400">The snapshot is taken the moment a proposal is published.</text>
<rect class="dg-band" x="300" y="112" width="220" height="218" opacity="0.7"/>
<text x="410" y="134" class="dg-muted dg-sans" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.1">VOTING OPEN</text>
<line class="dg-s-brand" x1="300" y1="96" x2="300" y2="330" stroke-width="2" stroke-dasharray="0"/>
<text x="300" y="90" class="dg-ink dg-sans" font-size="15" font-weight="600" text-anchor="middle">Proposal published</text>
<line class="dg-s-muted" x1="520" y1="112" x2="520" y2="330" stroke-width="1.25" stroke-dasharray="4 4"/>
<text x="520" y="106" class="dg-muted dg-sans" font-size="13" font-weight="400" text-anchor="middle">Voting closes</text>
<polyline class="dg-s-muted" points="150,160 560,160" fill="none" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#02-arrow-muted)"/>
<text x="560" y="150" class="dg-muted dg-mono" font-size="12" font-weight="400" text-anchor="end">time</text>
<rect class="dg-card dg-s-brand" x="243.8" y="148" width="112.39999999999999" height="24" rx="4" stroke-width="1.5"/>
<text x="300" y="164" class="dg-accent dg-mono" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.6">SNAPSHOT BLOCK</text>
<text x="28" y="226" class="dg-ink dg-sans" font-size="16" font-weight="600">Wallet A</text>
<text x="28" y="248" class="dg-dim dg-sans" font-size="14" font-weight="400">enabled before</text>
<line class="dg-s-ok" x1="210" y1="232" x2="560" y2="232" stroke-width="3" stroke-linecap="round"/>
<circle class="dg-f-ok" cx="210" cy="232" r="7"/>
<text x="210" y="218" class="dg-dim dg-sans" font-size="12" font-weight="400" text-anchor="middle">Enabled</text>
<circle class="dg-f-ok" cx="589" cy="232" r="5"/>
<text x="600" y="236" class="dg-f-ok dg-mono" font-size="13" font-weight="600" letter-spacing="0.5">CAN VOTE</text>
<text x="28" y="292" class="dg-ink dg-sans" font-size="16" font-weight="600">Wallet B</text>
<text x="28" y="314" class="dg-dim dg-sans" font-size="14" font-weight="400">enabled after</text>
<line class="dg-s-no" x1="400" y1="298" x2="560" y2="298" stroke-width="3" stroke-linecap="round"/>
<circle class="dg-f-no" cx="400" cy="298" r="7"/>
<text x="400" y="284" class="dg-dim dg-sans" font-size="12" font-weight="400" text-anchor="middle">Enabled</text>
<circle class="dg-f-no" cx="589" cy="298" r="5"/>
<text x="600" y="302" class="dg-f-no dg-mono" font-size="13" font-weight="600" letter-spacing="0.5">CANNOT VOTE</text>
<text x="600" y="320" class="dg-dim dg-sans" font-size="12" font-weight="400">on this proposal</text>
<text x="28" y="366" class="dg-dim dg-sans" font-size="14" font-weight="400">The platform reads each wallet as it was at the snapshot block.</text>
<text x="28" y="388" class="dg-dim dg-sans" font-size="14" font-weight="400">Enabling a wallet later does not change that. Wallet B can vote on</text>
<text x="28" y="410" class="dg-dim dg-sans" font-size="14" font-weight="400">any proposal published after it was enabled.</text>
<line class="dg-s-edge" x1="28" y1="446" x2="692" y2="446" stroke-width="1"/>
<text x="28" y="466" class="dg-muted dg-mono" font-size="11" font-weight="500" letter-spacing="0.6">LAST VERIFIED 22 OCT 2026</text>
<text x="692" y="466" class="dg-muted dg-mono" font-size="11" font-weight="400" text-anchor="end">redbelly-governance.vercel.app</text>
</svg>
